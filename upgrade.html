<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot-upgraider - Универсальный Апгрейд</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="logo">ILDIVSITE</div>
        <div class="user-balance">Баланс: <span id="balance-val">1000</span> ₴</div>
    </header>

    <div class="nav-menu-container">
        <a href="keis.html" class="menu-btn">Brainrot-drop</a>
        <a href="ilditv.html" class="menu-btn">infa-ilditv</a>
        <a href="upgrade.html" class="menu-btn active">Brainrot-upgraider</a>
    </div>

    <main class="main-content">
        <section class="tab-section">
            <h1>Brainrot-upgraider ⚡</h1>
            <p>Выбери любого персонажа из инвентаря и цель улучшения!</p>
            
            <div class="upgrade-panel">
                <!-- Слот слева (крутится при апгрейде) -->
                <div class="upgrade-slot" id="slot-input">
                    <p>Выбери предмет ниже</p>
                </div>
                <!-- Стрелка посередине (пульсирует при апгрейде) -->
                <div class="upgrade-arrows" id="arrow-element">➔</div>
                <!-- Слот справа (показывает цель и тоже крутится) -->
                <div class="upgrade-slot" id="slot-output" style="border: 2px dashed #444; color: #7e7e8f;">
                    <p>Цель крафта</p>
                </div>
            </div>

            <div style="margin-top: 15px;" class="upgrade-targets">
                <button class="target-btn" id="btn-lagrande" onclick="selectTarget('lagrande', this)">на Ла Гранде</button>
                <button class="target-btn" id="btn-garama" onclick="selectTarget('garama', this)">на Гараму</button>
                <button class="target-btn" id="btn-dragon" onclick="selectTarget('dragon', this)">на Драгона</button>
            </div>

            <div id="chance-display" style="margin-top: 20px; font-size: 18px; font-weight: bold; color: #ff9900;">
                Шанс апгрейда: -- %
            </div>

            <button id="start-upgrade-btn" class="spin-button main-action" style="margin-top: 15px;" disabled>Запустить Апгрейд</button>
            <h3 id="upgrade-status" style="margin-top: 15px; color:#ff9900;"></h3>

            <div class="inventory-section" style="width: 100%;">
                <h3>Ваш инвентарь для улучшения:</h3>
                <div id="upgrade-inv-grid" class="inventory-grid"></div>
            </div>
        </section>
    </main>

    <script>
        var currentUser = localStorage.getItem("ildiv_logged_in") || "guest";

        var balance = parseInt(localStorage.getItem("bal_" + currentUser)) || 1000;
        var inventory = JSON.parse(localStorage.getItem("inv_" + currentUser)) || [];
        
        var selectedIndex = null;
        var selectedItem = null;
        var selectedTargetId = null;
        var currentCalculatedChance = 0;

        var invGrid = document.getElementById("upgrade-inv-grid");
        var slotInput = document.getElementById("slot-input");
        var slotOutput = document.getElementById("slot-output");
        var arrowElement = document.getElementById("arrow-element");
        var upgradeBtn = document.getElementById("start-upgrade-btn");
        var statusText = document.getElementById("upgrade-status");
        var chanceDisplay = document.getElementById("chance-display");

        var targetObjects = {
            lagrande: { id: "lagrande", name: "Ла Гранде", img: "images4.jpg", rarity: "common", sellPrice: 10 },
            garama: { id: "garama", name: "Гарама", img: "images3.jpg", rarity: "epic", sellPrice: 50 },
            dragon: { id: "dragon", name: "Драгон", img: "images5.jpg", rarity: "legendary", sellPrice: 1000 }
        };

        function saveData() {
            localStorage.setItem("bal_" + currentUser, balance);
            localStorage.setItem("inv_" + currentUser, JSON.stringify(inventory));
        }

        function updateUI() {
            document.getElementById("balance-val").textContent = balance;
            invGrid.innerHTML = "";
            
            if (inventory.length === 0) {
                invGrid.innerHTML = "<p style='color:#7e7e8f;'>Ваш инвентарь пуст.</p>";
                return;
            }

            inventory.forEach(function(item, index) {
                var card = document.createElement("div");
                card.className = "inventory-card " + item.rarity + (selectedIndex === index ? " selected-card" : "");
                card.innerHTML = "<img src='" + item.img + "'><div class='inv-name'>" + item.name + "</div>";
                card.onclick = function() { selectItem(index, item); };
                invGrid.appendChild(card);
            });
        }

        function selectItem(index, item) {
            selectedIndex = index;
            selectedItem = item;
            slotInput.innerHTML = "<div class='card " + item.rarity + "' style='margin:0; border:none;'><img src='" + item.img + "'><div class='card-info'>" + item.name + "</div></div>";
            calculateChance();
            updateUI();
        }

        function selectTarget(targetId, btn) {
            selectedTargetId = targetId;
            document.querySelectorAll(".target-btn").forEach(function(b) { b.classList.remove("selected-target"); });
            btn.classList.add("selected-target");
            
            var targetItem = targetObjects[targetId];
            slotOutput.innerHTML = "<div class='card " + targetItem.rarity + "' style='margin:0; border:none;'><img src='" + targetItem.img + "'><div class='card-info'>" + targetItem.name + "</div></div>";
            
            calculateChance();
        }

        function calculateChance() {
            if (!selectedItem || !selectedTargetId) {
                chanceDisplay.textContent = "Шанс апгрейда: -- %";
                upgradeBtn.disabled = true;
                return;
            }

            var inputPrice = selectedItem.sellPrice;
            var targetPrice = targetObjects[selectedTargetId].sellPrice;

            if (inputPrice >= targetPrice) {
                currentCalculatedChance = 100;
            } else {
                if (selectedItem.id === "lagrande" && selectedTargetId === "garama") currentCalculatedChance = 35;
                else if (selectedItem.id === "lagrande" && selectedTargetId === "dragon") currentCalculatedChance = 1; 
                else if (selectedItem.id === "garama" && selectedTargetId === "dragon") currentCalculatedChance = 5;   
                else currentCalculatedChance = Math.floor((inputPrice / targetPrice) * 100);
            }

            chanceDisplay.textContent = "Шанс апгрейда: " + currentCalculatedChance + "%";
            upgradeBtn.disabled = false;
        }

        upgradeBtn.onclick = function() {
            if (selectedIndex === null || !selectedTargetId) return;
            upgradeBtn.disabled = true;
            statusText.textContent = "Скрещивание брэйнрот матриц... ⚡";

            // ВКЛЮЧАЕМ АНИМАЦИЮ КРУЧЕНИЯ ДЛЯ СЛОТОВ И СТРЕЛКИ
            slotInput.classList.add("spin-active");
            slotOutput.classList.add("spin-active");
            arrowElement.classList.add("arrow-active");

            setTimeout(function() {
                var rand = Math.random() * 100;
                var isSuccess = rand <= currentCalculatedChance;
                var targetItem = targetObjects[selectedTargetId];

                // ОТКЛЮЧАЕМ АНИМАЦИЮ КРУЧЕНИЯ
                slotInput.classList.remove("spin-active");
                slotOutput.classList.remove("spin-active");
                arrowElement.classList.remove("arrow-active");

                inventory.splice(selectedIndex, 1);

                if (isSuccess) {
                    inventory.push(targetItem);
                    statusText.innerHTML = "<span style='color:#4caf50;'>УСПЕХ! Получен: " + targetItem.name + " 🎉</span>";
                    slotInput.innerHTML = "<p>Выбери предмет</p>";
                    slotOutput.innerHTML = "<div class='card " + targetItem.rarity + "' style='margin:0; border:none;'><img src='" + targetItem.img + "'><div class='card-info'>" + targetItem.name + "</div></div>";
                } else {
                    statusText.innerHTML = "<span style='color:#eb4b4b;'>НЕУДАЧА! Предмет безвозвратно сгорел. ❌</span>";
                    slotInput.innerHTML = "<p>Выбери предмет</p>";
                    slotOutput.innerHTML = "<p>Цель крафта</p>";
                }

                selectedIndex = null; selectedItem = null; selectedTargetId = null;
                document.querySelectorAll(".target-btn").forEach(function(b) { b.classList.remove("selected-target"); });
                
                calculateChance();
                saveData();
                updateUI();
            }, 2000); // Крутится ровно 2 секунды
        };

        updateUI();
    </script>
</body>
</html>
