<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-Drop - История выигрышей</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .live-page-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;
            margin-top: 25px; padding: 20px; background: #111116; border-radius: 12px; border: 1px solid #222232;
        }
        .feed-card {
            background: #1a1a26; border-radius: 10px; border: 1px solid #2d2d3f; border-bottom: 4px solid #555;
            padding: 15px; text-align: center; position: relative; overflow: hidden; transition: transform 0.2s;
        }
        .feed-card:hover { transform: translateY(-5px); }
        .feed-user { font-size: 13px; font-weight: bold; color: #00ffcc; margin-bottom: 10px; background: rgba(0, 255, 204, 0.05); padding: 4px; border-radius: 4px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .feed-img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .feed-name { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .feed-price { font-size: 12px; color: #ff9900; font-weight: bold; }
        .feed-card.common { border-bottom-color: #b0b0b0; }
        .feed-card.rare { border-bottom-color: #4b69ff; box-shadow: 0 4px 15px rgba(75,105,255,0.15); }
        .feed-card.epic { border-bottom-color: #8847ff; box-shadow: 0 4px 15px rgba(136,71,255,0.15); }
        .feed-card.mythic { border-bottom-color: #d32ce6; box-shadow: 0 4px 15px rgba(211,44,230,0.15); }
        .feed-card.legendary { border-bottom-color: #caaa32; box-shadow: 0 4px 20px rgba(202,170,50,0.3); }
        .live-badge { display: inline-block; background: #ff3366; color: #fff; font-size: 12px; font-weight: bold; padding: 5px 12px; border-radius: 4px; margin-bottom: 10px; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="logo">ILDIVSITE</div>
        <div class="user-balance">Баланс: <span id="balance-val">1000</span> ₴</div>
    </header>

    <div class="nav-menu-container">
        <a href="keis.html" class="menu-btn">Brainrot-drop</a>
        <a href="ilditv.html" class="menu-btn">infa-ilditv</a>
        <a href="upgrade.html" class="menu-btn">Brainrot-upgraider</a>
        <a href="livespawn.html" class="menu-btn active">Live-Drop 🔴</a>
    </div>

    <main class="main-content">
        <section class="tab-section">
            <div class="live-badge">ЖИВОЙ ПОТОК ДРОПОВ</div>
            <h1>Глобальная лента выигрышей матриц</h1>
            <p class="subtitle">Здесь отображается то, что лутают игроки прямо сейчас</p>
            <div class="live-page-grid" id="live-feed-grid"></div>
        </section>
    </main>

    <script>
        var currentUser = localStorage.getItem("ildiv_logged_in") || "guest";
        
        // Фикс баланса: жесткая проверка на ноль
        var savedBalance = localStorage.getItem("bal_" + currentUser);
        var balance = (savedBalance !== null) ? parseInt(savedBalance) : 1000;
        document.getElementById("balance-val").textContent = balance;

        var poolItems = [
            { name: "Ла Гранде", img: "images4.jpg", rarity: "common", price: 10 },
            { name: "Гарама", img: "images3.jpg", rarity: "epic", price: 50 },
            { name: "БУРГЕР И ФРАЮРО", img: "images6.jpg", rarity: "rare", price: 67 },
            { name: "ЛА СЕКРЕТ", img: "images7.jpg", rarity: "mythic", price: 100 },
            { name: "Драгон", img: "images5.jpg", rarity: "legendary", price: 1000 }
        ];

        var fakeUsers = ["SigmaMale", "Rizler_Pro", "Skibidi_Boss", "MemeKing", "GlitchBoi", "Pudge_Enjoyer", "Cringe_Lord", "Anon_99", "Bratishka"];

        function getLiveList() { return JSON.parse(localStorage.getItem("global_live_feed")) || []; }

        function renderFeed() {
            var grid = document.getElementById("live-feed-grid"); var list = getLiveList(); grid.innerHTML = "";
            if (list.length === 0) { grid.innerHTML = "<p style='color:#666; width:100%; text-align:center;'>Пока что никто ничего не залутал. Откройте кейс или запустите апгрейд!</p>"; return; }
            list.forEach(function(item) {
                var card = document.createElement("div"); card.className = "feed-card " + item.rarity;
                card.innerHTML = `<div class="feed-user">👤 ${item.user}</div><img class="feed-img" src="${item.img}"><div class='feed-name'>${item.name}</div><div class='feed-price'>${item.price} ₴</div>`;
                grid.appendChild(card);
            });
        }

        function spawnFakeDrop() {
            var list = getLiveList(); var randomBot = fakeUsers[Math.floor(Math.random() * fakeUsers.length)]; var randomItem = poolItems[Math.floor(Math.random() * poolItems.length)];
            list.unshift({ user: randomBot, name: randomItem.name, img: randomItem.img, rarity: randomItem.rarity, price: randomItem.price });
            if (list.length > 20) list.pop(); localStorage.setItem("global_live_feed", JSON.stringify(list)); renderFeed();
        }

        renderFeed();
        function loop() { var randTime = Math.random() * (8000 - 4000) + 4000; setTimeout(function() { spawnFakeDrop(); loop(); }, randTime); }
        loop();
    </script>
</body>
</html>
